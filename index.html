<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div class="container">
        <h1>RAG Chatbot</h1>
        
        <div id="chatBox">
            <div class="message bot">
                Hello! Ask me any question based on your uploaded reference PDFs.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="question" placeholder="Ask anything from your PDFs..." autocomplete="off">
            <button onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
